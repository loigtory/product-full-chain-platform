<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFC 产品全链路平台 · 对话主体工作台原型</title>
<style>
:root{
  --brand:#00A0E9; --brand-strong:#0078C8; --brand-soft:#E6F7FF;
  --text-1:#333; --text-2:#666; --text-3:#999;
  --border:#E8EDF2; --surface:#fff; --surface-2:#F5F7FA;
  --green:#22C55E; --green-soft:#F0FDF4; --green-border:#BBF7D0;
  --orange:#F97316; --orange-soft:#FFF7E6; --orange-border:#FDBF60;
  --red:#F43F5E; --red-soft:#FFF1F2; --red-border:#FECDD3;
  --purple:#A855F7; --purple-soft:#FAF5FF; --purple-border:#E9D5FF;
  --cyan:#06B6D4; --cyan-soft:#ECFEFF; --cyan-border:#A5F3FC;
  --blue:#3B82F6; --blue-soft:#EFF6FF; --blue-border:#BFDBFE;
  --radius:8px; --radius-sm:6px;
  --mono:Consolas,'Cascadia Mono','JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
svg{width:16px;height:16px;flex:none;}
html,body{height:100%;}
body{
  min-width:1120px;background:#F5F7FA;color:var(--text-1);
  font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  font-size:14px;line-height:1.55;
}
button{font-family:inherit;font-size:13px;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px;}
::-webkit-scrollbar-track{background:transparent;}
:focus-visible{outline:2px solid var(--brand);outline-offset:1px;border-radius:4px;}

/* ===== 顶部导航 ===== */
.global-header{
  display:flex;align-items:center;gap:20px;height:52px;padding:0 20px;
  background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--brand-strong);white-space:nowrap;}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;}
.main-nav{display:flex;gap:4px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius-sm);
  color:var(--text-2);font-size:13px;font-weight:500;white-space:nowrap;
}
.nav-item:hover{background:var(--surface-2);color:var(--text-1);}
.nav-item.active{background:var(--brand-soft);color:var(--brand-strong);font-weight:600;}
.header-right{display:flex;align-items:center;gap:8px;}
.icon-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-2);
}
.icon-btn:hover{background:var(--surface-2);color:var(--text-1);}
.search-box{
  display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:0 10px;height:32px;width:220px;color:var(--text-3);font-size:13px;
}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.demo-tag{font-size:11px;color:var(--text-3);border:1px solid var(--border);border-radius:999px;padding:2px 8px;white-space:nowrap;}

/* ===== 工作空间布局 ===== */
.work-layout{display:flex;height:calc(100vh - 52px);min-height:600px;}
.ctx-rail{
  width:252px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
}
.chat-main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--surface);}
.side-panel{
  width:368px;flex:none;background:var(--surface);border-left:1px solid var(--border);
  display:flex;flex-direction:column;
}

/* ===== 上下文栏 ===== */
.rail-section{padding:14px 16px;border-bottom:1px solid var(--border);}
.rail-title{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:10px;letter-spacing:.04em;}
.req-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.req-name{font-size:15px;font-weight:700;line-height:1.35;}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;}
.badge-blue{background:var(--brand-soft);color:var(--brand-strong);}
.badge-orange{background:var(--orange-soft);color:#B45309;}
.badge-green{background:var(--green-soft);color:#15803D;}
.badge-red{background:var(--red-soft);color:#B91C1C;}
.badge-purple{background:var(--purple-soft);color:#7E22CE;}
.badge-cyan{background:var(--cyan-soft);color:#0E7490;}
.badge-gray{background:#F1F5F9;color:#64748B;}
.meta-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-top:6px;flex-wrap:wrap;}
.stage-rail{display:flex;flex-direction:column;gap:2px;}
.stage-node{
  display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--radius-sm);
  color:var(--text-2);font-size:13px;text-align:left;width:100%;
}
.stage-node:hover{background:var(--surface-2);}
.stage-node.active{background:var(--brand-soft);color:var(--brand-strong);font-weight:600;}
.stage-dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;}
.stage-dot svg{width:11px;height:11px;}
.stage-node.passed .stage-dot{background:var(--green);color:#fff;}
.stage-node.active .stage-dot{background:var(--brand);color:#fff;}
.stage-node.upcoming .stage-dot{background:var(--surface-2);border:1px solid var(--border);color:var(--text-3);}
.stage-node.blocked .stage-dot{background:var(--red);color:#fff;}
.ctx-list{display:flex;flex-direction:column;gap:6px;font-size:13px;}
.ctx-item{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);}
.ctx-item .lbl{flex:1;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ctx-item .cnt{font-size:11px;color:var(--text-3);}
.skill-chip{
  display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;font-size:12px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);
}
.skill-chip.on{background:var(--brand-soft);border-color:#B3E2F9;color:var(--brand-strong);font-weight:600;}
.rail-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;
  border:1px dashed #B3E2F9;border-radius:var(--radius-sm);color:var(--brand-strong);font-weight:600;font-size:13px;
}
.rail-btn:hover{background:var(--brand-soft);}

/* ===== 对话时间线 ===== */
.req-context-bar{
  display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);
  background:var(--surface);flex-wrap:wrap;
}
.req-context-bar .name{font-size:15px;font-weight:700;}
.req-context-bar .sep{width:1px;height:16px;background:var(--border);}
.stream{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;background:var(--surface);}
.msg{display:flex;gap:10px;max-width:820px;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-bubble{
  padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.6;
}
.msg.user .msg-bubble{background:var(--brand-soft);border:1px solid #B3E2F9;border-top-right-radius:3px;}
.msg.ai .msg-bubble{background:var(--surface-2);border:1px solid var(--border);border-top-left-radius:3px;color:var(--text-1);}
.msg-avatar{
  width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--brand);color:#fff;margin-top:2px;
}
.msg.user .msg-avatar{background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);}
.msg-avatar svg{width:14px;height:14px;}

/* 卡片 */
.card{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);
  padding:13px 15px;max-width:820px;box-shadow:0 1px 2px rgba(15,23,42,.04);
}
.card .card-head{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap;}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.card-sub{font-size:12px;color:var(--text-3);}
.evidence{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding-top:9px;
  border-top:1px dashed var(--border);font-size:11px;color:var(--text-3);
}
.evidence span{display:inline-flex;align-items:center;gap:4px;}
.evidence svg{width:11px;height:11px;}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:var(--radius-sm);
  font-weight:600;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text-1);
  transition:background .15s,border-color .15s;
}
.btn:hover{border-color:#B3E2F9;background:var(--brand-soft);}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
.btn.primary:hover{background:var(--brand-strong);}
.btn.success{background:var(--green);border-color:var(--green);color:#fff;}
.btn.success:hover{background:#16A34A;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2);}
.btn.ghost:hover{background:var(--surface-2);color:var(--text-1);}
.btn:disabled{opacity:.55;cursor:not-allowed;}
.btn.danger{color:#B91C1C;border-color:var(--red-border);background:var(--red-soft);}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

/* 澄清卡 */
.clarify-q{
  display:flex;align-items:flex-start;gap:8px;padding:9px 11px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:7px;background:var(--surface-2);font-size:13px;
}
.clarify-q .num{flex:none;width:18px;height:18px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;}
.clarify-q.picked{border-color:var(--green-border);background:var(--green-soft);}
.clarify-q.picked .num{background:var(--green);color:#fff;}
.clarify-q .txt{flex:1;}
.opt-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);margin-top:5px;margin-right:6px;
}
.opt-chip:hover{border-color:var(--brand);color:var(--brand-strong);}
.opt-chip.picked{background:var(--brand-soft);border-color:#B3E2F9;color:var(--brand-strong);}

/* 草稿卡 Diff */
.diff-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
.diff-table th{font-size:12px;color:var(--text-3);text-align:left;padding:5px 9px;border-bottom:1px solid var(--border);font-weight:600;}
.diff-table td{padding:7px 9px;border-bottom:1px solid #F1F5F9;vertical-align:top;}
.diff-table td.field{width:110px;font-weight:600;color:var(--text-2);white-space:nowrap;}
.diff-before{color:var(--text-3);}
.diff-after{color:var(--text-1);}
.diff-after.new{color:#15803D;}
.status-line{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;}
.status-line svg{width:13px;height:13px;}

/* 进度卡 */
.progress-bar{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:9px;}
.progress-fill{height:100%;background:var(--brand);border-radius:3px;transition:width .5s;}
.step-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:13px;}
.step-item{display:flex;align-items:center;gap:8px;color:var(--text-2);}
.step-item.done{color:var(--text-1);}
.step-item.done .step-dot{background:var(--green);color:#fff;}
.step-item.active .step-dot{background:var(--brand);color:#fff;}
.step-dot{width:16px;height:16px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;}
.step-dot svg{width:10px;height:10px;}

/* 终端卡 */
.term-box{
  background:#0F172A;color:#CBD5E1;border-radius:var(--radius-sm);padding:11px 13px;
  font-family:var(--mono);font-size:12px;line-height:1.65;max-height:210px;overflow-y:auto;
}
.term-box .t-head{display:flex;align-items:center;gap:8px;color:#64748B;margin-bottom:6px;font-size:11px;}
.term-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.term-line{white-space:pre-wrap;word-break:break-all;}
.term-line .cmd{color:#E2E8F0;}
.term-line .ok{color:#4ADE80;}
.term-line .info{color:#38BDF8;}
.term-line .warn{color:#FBBF24;}
.term-cursor{display:inline-block;width:7px;height:13px;background:#4ADE80;vertical-align:text-bottom;animation:blink 1s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

/* 审批卡 */
.approval-scope{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;font-size:13px;margin-top:8px;}
.approval-scope .row{display:flex;gap:8px;padding:2px 0;color:var(--text-2);}
.approval-scope .row b{color:var(--text-1);width:64px;flex:none;font-weight:600;}

/* 观察指标 */
.kpi-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;}
.kpi{flex:1;min-width:110px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;}
.kpi .v{font-size:19px;font-weight:700;color:var(--text-1);}
.kpi .l{font-size:12px;color:var(--text-3);margin-top:2px;}

/* 输入区 */
.composer{
  border-top:1px solid var(--border);padding:12px 24px 14px;background:var(--surface);
  display:flex;align-items:flex-end;gap:10px;
}
.composer-box{
  flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:12px;
  background:var(--surface);padding:9px 8px 9px 12px;transition:border-color .15s,box-shadow .15s;
}
.composer-box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,160,233,.12);}
.composer-box input{
  flex:1;border:none;outline:none;font-size:14px;color:var(--text-1);background:transparent;
}
.composer-box input::placeholder{color:var(--text-3);}
.send-btn{
  width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;
}
.send-btn:hover{background:var(--brand-strong);}
.send-btn svg{width:17px;height:17px;}
.attch-btn{width:30px;height:30px;border-radius:8px;color:var(--text-2);display:flex;align-items:center;justify-content:center;}
.attch-btn:hover{background:var(--surface-2);color:var(--brand-strong);}
.composer-hint{font-size:11px;color:var(--text-3);padding:0 4px 0 12px;}

/* 能力面板 */
.cap-panel{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;max-height:76vh;overflow-y:auto;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 16px 48px rgba(15,23,42,.18);
  z-index:100;padding:18px 20px;
}
.cap-panel .cap-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cap-panel h3{font-size:16px;font-weight:700;}
.cap-group{margin-bottom:14px;}
.cap-group .g-title{font-size:12px;font-weight:600;color:var(--text-3);margin-bottom:8px;}
.cap-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--border);border-radius:var(--radius-sm);
  margin-bottom:7px;background:var(--surface);
}
.cap-item:hover{border-color:#B3E2F9;}
.cap-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;}
.cap-ico svg{width:15px;height:15px;}
.cap-item .cap-name{font-size:13px;font-weight:600;}
.cap-item .cap-desc{font-size:12px;color:var(--text-3);}
.cap-item .cap-meta{font-size:11px;color:var(--text-3);display:flex;gap:6px;margin-top:2px;}
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.32);z-index:99;}
.loaded-tag{font-size:11px;color:#15803D;background:var(--green-soft);border:1px solid var(--green-border);border-radius:999px;padding:2px 8px;font-weight:600;}

/* 右侧面板 */
.panel-tabs{display:flex;border-bottom:1px solid var(--border);}
.panel-tab{
  flex:1;min-width:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 0;
  font-size:13px;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;
}
.panel-tab:hover{color:var(--text-1);background:var(--surface-2);}
.panel-tab.active{color:var(--brand-strong);border-bottom-color:var(--brand);font-weight:600;}
.panel-body{flex:1;overflow-y:auto;padding:14px 16px;}
.panel-title{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.panel-term{
  background:#0F172A;border-radius:var(--radius-sm);padding:12px 14px;color:#CBD5E1;
  font-family:var(--mono);font-size:12px;line-height:1.7;height:100%;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
}
.ev-item{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #F1F5F9;font-size:12.5px;}
.ev-item .k{width:70px;flex:none;color:var(--text-3);font-weight:600;}
.ev-item .v{color:var(--text-1);word-break:break-all;}

/* ===== 首页 ===== */
.home-wrap{padding:28px 36px;max-width:1280px;margin:0 auto;}
.home-hero{
  display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;
  background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 26px;
}
.home-hero h1{font-size:22px;font-weight:700;color:var(--text-1);}
.home-hero .sub{font-size:13px;color:var(--text-2);margin-top:6px;max-width:640px;}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.panel-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.panel-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.todo-item{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface);
}
.todo-item:hover{border-color:#B3E2F9;cursor:pointer;}
.todo-item .ico{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;}
.todo-item .t1{font-size:13px;font-weight:600;}
.todo-item .t2{font-size:12px;color:var(--text-3);}
.todo-item .go{margin-left:auto;color:var(--text-3);}
.req-row{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface);
}
.req-row:hover{border-color:#B3E2F9;cursor:pointer;}
.req-row .nm{font-size:13px;font-weight:600;flex:1;}
.brief-item{padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13px;color:var(--text-1);display:flex;gap:8px;}
.brief-item:last-child{border-bottom:none;}
.brief-item .lbl{flex:none;font-size:11px;color:var(--brand-strong);background:var(--brand-soft);border-radius:4px;padding:1px 6px;font-weight:600;height:fit-content;margin-top:2px;}

/* toast */
#toast-root{position:fixed;top:64px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
.toast{
  background:#1E293B;color:#F1F5F9;font-size:13px;padding:9px 14px;border-radius:8px;
  box-shadow:0 8px 24px rgba(15,23,42,.2);display:flex;align-items:center;gap:8px;
  animation:toast-in .2s ease;
}
.toast svg{width:14px;height:14px;color:#4ADE80;}
@keyframes toast-in{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

/* 占位页 */
.placeholder-page{padding:60px 36px;max-width:1280px;margin:0 auto;}
.placeholder-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:34px 30px;}
.placeholder-card h2{font-size:19px;font-weight:700;margin-bottom:10px;}
.placeholder-card p{font-size:13px;color:var(--text-2);line-height:1.7;max-width:680px;}
.placeholder-card ul{margin:10px 0 0 18px;font-size:13px;color:var(--text-2);}

/* ===== 配置中心 ===== */
.config-wrap{padding:24px 32px;max-width:1280px;margin:0 auto;}
.config-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.config-head h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:8px;}
.config-head .sub{font-size:13px;color:var(--text-2);margin-top:4px;}
.config-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.config-tab{
  display:flex;align-items:center;gap:6px;padding:9px 16px;font-size:13px;font-weight:500;color:var(--text-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.config-tab:hover{color:var(--text-1);}
.config-tab.active{color:var(--brand-strong);border-bottom-color:var(--brand);font-weight:600;}
.config-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.config-card h3{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.cap-row{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--radius-sm);margin-bottom:8px;background:var(--surface);
}
.cap-row:hover{border-color:#B3E2F9;}
.cap-row .cap-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;}
.cap-row .cap-main{flex:1;min-width:0;}
.cap-row .cap-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
.cap-row .cap-desc{font-size:12px;color:var(--text-3);margin-top:2px;}
.cap-row .cap-meta{font-size:11px;color:var(--text-3);display:flex;gap:10px;margin-top:3px;flex-wrap:wrap;}
.cap-row .cap-actions{display:flex;align-items:center;gap:8px;flex:none;}
.type-tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;}
.type-Skill{background:var(--purple-soft);color:#7E22CE;}
.type-MCP{background:var(--blue-soft);color:#1D4ED8;}
.type-终端工具{background:var(--cyan-soft);color:#0E7490;}
.switch{position:relative;width:34px;height:20px;border-radius:999px;background:#CBD5E1;transition:background .15s;flex:none;}
.switch.on{background:var(--brand);}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;}
.switch.on::after{transform:translateX(14px);}
.bind-grid{width:100%;border-collapse:collapse;font-size:13px;}
.bind-grid th{font-size:12px;color:var(--text-3);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);}
.bind-grid td{padding:7px 10px;border-bottom:1px solid #F1F5F9;vertical-align:top;}
.bind-grid tr.stage-row:hover td{background:var(--surface-2);}
.bind-grid .st-name{font-weight:600;white-space:nowrap;}
.bind-cell{display:flex;flex-wrap:wrap;gap:6px;}
.bind-chip{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;user-select:none;
}
.bind-chip:hover{border-color:var(--brand);}
.bind-chip.on{background:var(--brand-soft);border-color:#B3E2F9;color:var(--brand-strong);font-weight:600;}
.bind-chip .ico{display:inline-flex;}
.audit-line{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:12.5px;color:var(--text-2);}
.audit-line .t{flex:none;color:var(--text-3);}
.addcap-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
.addcap-form .full{grid-column:1/-1;}
.addcap-form label{font-size:12px;font-weight:600;color:var(--text-2);display:block;margin-bottom:4px;}
.addcap-form input,.addcap-form select{
  width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13px;color:var(--text-1);background:var(--surface);outline:none;
}
.addcap-form input:focus,.addcap-form select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,160,233,.12);}

/* ===== 流式打字 ===== */
.msg-bubble.typing::after{content:'';display:inline-block;width:2px;height:1em;background:var(--brand-strong);margin-left:2px;vertical-align:-2px;animation:pfc-blink 0.9s steps(1) infinite;}
@keyframes pfc-blink{0%,100%{opacity:1;}50%{opacity:0;}}
.empty-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;color:var(--text-3);font-size:13px;gap:8px;text-align:center;}
.empty-stage .ic{opacity:.5;}
.req-switch-panel{width:420px;max-width:92vw;}
.req-switch-panel .req-opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface);}
.req-switch-panel .req-opt:hover{border-color:#B3E2F9;background:var(--brand-soft);}
.req-switch-panel .req-opt.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,160,233,.12);}
.req-switch-panel .req-opt .nm{font-size:13px;font-weight:600;flex:1;}
.req-switch-panel .req-opt .st{font-size:12px;color:var(--text-3);}
</style>
</head>

function renderCtxRail(st, stageIdx, ctx, meta){
  const actualIdx = STAGES.findIndex(s=>s.id===state.stageByReq[state.activeReq]);
  const stageNodes = STAGES.map((s,i)=>{
    let cls='upcoming', dotCls='';
    if(i<actualIdx){cls='passed';}
    if(i===stageIdx){cls='active';}
    if(s.id==='accept' && state.stage==='accept'){cls='active';}
    const dotBg = i===stageIdx ? 'background:var(--brand)' : (i<actualIdx?'background:var(--green)':'background:var(--surface-2);border:1px solid var(--border)');
    return '<button class="stage-node '+cls+'" data-stage="'+s.id+'">'+
      '<span class="stage-dot" style="'+dotBg+';color:'+(i===stageIdx||i<actualIdx?'#fff':'var(--text-3)')+'">'+s.dot+'</span>'+
      '<span>'+s.label+'</span>'+
      (i===actualIdx?'<span style="margin-left:auto;font-size:11px;color:var(--brand-strong);">当前</span>':s.id===state.stage?'<span style="margin-left:auto;font-size:11px;">查看</span>':'')+

      + '<div style="display:flex;flex-direction:column;gap:10px;">'

function renderMsg(m){
  const ev = m.ev ? '<div class="evidence">'
    + (m.ev.run?'<span>'+ic('activity')+' run '+esc(m.ev.run)+'</span>':'')
    + (m.ev.skill?'<span>'+ic('cpu')+' '+esc(m.ev.skill)+'</span>':'')
    + (m.ev.src?'<span>'+ic('file')+' '+esc(m.ev.src)+'</span>':'')
    + '</div>' : '';
  switch(m.t){
    case 'user':
      return '<div class="msg user"><div class="msg-avatar">'+ic('user')+'</div><div class="msg-bubble">'+esc(m.text)+'</div></div>';
    case 'ai':
      return '<div class="msg ai"><div class="msg-avatar">'+ic('sparkles')+'</div><div><div class="msg-bubble'+(m.typing?' typing':'')+'"'+(m._id?' id="ai-text-'+m._id+'"':'')+'>'+esc(m.text)+'</div>'+ev+'</div></div>';
    case 'clarify':
      return '<div class="card"><div class="card-head"><span class="card-title">'+ic('alert')+' 需要澄清</span><span class="card-sub">回答后 Agent 继续整理</span></div>'
        + m.q.map(q=>'<div class="clarify-q'+(q.picked?' picked':'')+'" role="button" tabindex="0" data-action="answer-clarify" data-id="'+q.id+'">'
          + '<span class="num">'+(q.picked?ICONS.check:q.num)+'</span>'
          + '<span class="txt">'+esc(q.text)+'</span></div>').join('')
        + '</div>';
    case 'draft':
      const d = m;
      const confirmed = d.confirmed;
      return '<div class="card"><div class="card-head"><span class="card-title">'+ic('file')+' '+esc(d.title)+'</span>'
        + (confirmed?'<span class="badge badge-green">已确认写入 '+esc(d.appliedVersion||d.version)+'</span>':'<span class="badge badge-blue">待确认</span>')
        + '<span class="card-sub">'+esc(d.sub)+'</span></div>'
        + '<table class="diff-table"><tr><th>字段</th><th>现状</th><th>建议值</th></tr>'
        + d.fields.map(f=>'<tr><td class="field">'+esc(f.f)+'</td><td class="diff-before">'+esc(f.before)+'</td><td class="diff-after'+(f.before==='（空）'||f.before==='（草稿）'?' new':'')+'">'+esc(f.after)+'</td></tr>').join('')
        + '</table>'
        + (confirmed ? '' : '<div class="btn-group">'
            + '<button class="btn" data-action="open-diff" data-id="'+d.id+'">'+ic('eye')+' 查看完整 Diff</button>'
            + '<button class="btn primary" data-action="confirm-draft" data-id="'+d.id+'">'+ic('check')+' 确认写入</button>'
            + '<button class="btn ghost" data-action="reject-draft" data-id="'+d.id+'">'+ic('x')+' 退回重写</button>'
          + '</div>')
        + ev + '</div>';
    case 'gate':
      const gs = m.status;
      return '<div class="card"><div class="card-head"><span class="card-title">'+ic('shield')+' '+esc(m.name)+'</span>'
        + (m.status==='PASSED'?'<span class="badge badge-green">'+esc(gs)+'</span>':m.status==='BLOCKED'?'<span class="badge badge-red">'+esc(gs)+'</span>':'<span class="badge badge-orange">'+esc(gs)+'</span>')+'</div>'
        + '<div style="font-size:13px;color:var(--text-1);">'+esc(m.scope)+'</div>'
        + (m.status==='PASSED'||m.status==='BLOCKED' ? '' : '<div class="btn-group"><button class="btn primary" data-action="gate-pass"'+(m.id?' data-id="'+m.id+'"':'')+'>'+ic('check')+' 确认通过</button><button class="btn danger" data-action="gate-block"'+(m.id?' data-id="'+m.id+'"':'')+'>'+ic('x')+' 标记阻断</button></div>')
        + ev + '</div>';
    case 'approval':
      const a=m;
      const ast = a.status==='approved'?'已批准':(a.status==='rejected'?'已拒绝':'待审批');
      return '<div class="card"><div class="card-head"><span class="card-title">'+ic('shield')+' '+esc(a.title)+'</span>'
        + (a.status==='pending'?'<span class="badge badge-orange">待审批</span>':a.status==='approved'?'<span class="badge badge-green">已批准</span>':'<span class="badge badge-red">已拒绝</span>')
        + '</div>'
        + '<div style="font-size:13px;font-weight:600;margin-bottom:4px;">'+esc(a.reason)+'</div>'
        + '<div class="approval-scope">'+a.scope.map(r=>'<div class="row"><b>'+esc(r.k)+'</b><span>'+esc(r.v)+'</span></div>').join('')+'</div>'
        + (a.status==='pending' ? '<div class="btn-group">'
            + '<button class="btn primary" data-action="approve">'+ic('check')+' 批准</button>'
            + '<button class="btn danger" data-action="reject">'+ic('x')+' 拒绝</button>'
            + '<button class="btn" data-action="shrink">'+ic('settings')+' 缩小范围</button>'
          + '</div>' : '')
        + ev + '</div>';
    case 'progress':
      const p=m;
      const done = p.status==='done';
      return '<div class="card" data-progress-id="'+p.id+'"><div class="card-head"><span class="card-title">'+ic('cpu')+' '+esc(p.title)+'</span>'
        + '<span class="badge '+(done?'badge-green':p.status==='stopped'?'badge-orange':'badge-cyan')+'">'+runLabel(p)+'</span>'
        + '<span class="card-sub">'+esc(p.skill)+' · '+esc(p.workspace)+'</span></div>'
        + '<div style="display:flex;align-items:center;gap:10px;">'
          + '<div class="progress-bar" style="flex:1;"><div class="progress-fill" id="fill-'+p.id+'" style="width:'+p.pct+'%"></div></div>'
          + '<span style="font-size:12px;color:var(--text-2);" id="pct-'+p.id+'">'+p.pct+'%</span>'
        + '</div>'
        + '<div class="step-list">'+p.steps.map(s=>'<div class="step-item '+(s.st=== 'done'?'done':s.st==='active'?'active':'')+'">'
          + '<span class="step-dot">'+(s.st==='done'?ICONS.check:(s.st==='active'?ICONS.clock:''))+'</span><span>'+esc(s.label)+'</span></div>').join('')+'</div>'
        + (p.status==='running' ? '<div class="btn-group"><button class="btn" data-action="stop-run" data-id="'+p.id+'">'+ic('stop')+' 停止运行</button></div>' : '')
        + ev + '</div>';
    case 'terminal':
      return '<div class="card"><div class="card-head"><span class="card-title">'+ic('terminal')+' '+esc(m.title)+'</span>'
        + '<span class="badge badge-cyan">'+(activeRun()?.status==='running'?'实时':activeRun()?runLabel(activeRun()):'记录')+'</span></div>'
        + '<div class="term-box" id="term-'+m.id+'">'
          + '<div class="t-head"><span class="term-dot" style="background:#4ADE80;"></span> zed · codex · '+esc(activeRun()?.workspace||'')+'</div>'
          + terminalLines(m)
          + (activeRun()?.status==='running'?'<span class="term-cursor"></span>':'')
        + '</div>'+ ev + '</div>';
    case 'kpi':
      return '<div class="card"><div class="card-head"><span class="card-title">'+ic('activity')+' '+esc(m.title)+'</span></div>'
        + '<div class="kpi-row">'+m.items.map(k=>'<div class="kpi"><div class="v">'+esc(k.v)+'</div><div class="l">'+esc(k.l)+'</div></div>').join('')+'</div>'
        + ev + '</div>';
    default: return '';
  }
}

  const root=document.getElementById('modal-root');
  const groups=[['Skill',CAPABILITIES.filter(c=>c.type==='Skill')],['MCP 连接',CAPABILITIES.filter(c=>c.type==='MCP')],['终端工具',CAPABILITIES.filter(c=>c.type==='终端工具')]];
  root.innerHTML='<div class="modal-mask" data-action="close-cap"></div>'
    + '<div class="cap-panel">'
      + '<div class="cap-head"><h3>对话中临时装载能力</h3><button class="icon-btn" data-action="close-cap">'+ic('x')+'</button></div>'
      + '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">临时装载只对当前会话生效；<b style="color:var(--brand-strong);cursor:pointer;" data-action="go-config">长期配置请到治理中心 · 能力配置</b>。Agent 可建议装载，你一键确认，记录进入审计。</div>'
      + groups.map(g=>'<div class="cap-group"><div class="g-title">'+g[0]+'</div>'
          + g[1].map(it=>{
              const on = state.capsOn.includes(it.id);
              const bound = (state.stageBind[state.stage]||[]).includes(it.id);
              return '<div class="cap-item"><span class="cap-ico" style="background:'+it.color+';">'+CAP_ICON[it.ico]+'</span>'
                + '<div style="flex:1;"><div class="cap-name">'+esc(it.name)+'</div><div class="cap-desc">'+esc(it.desc)+'</div>'
                + '<div class="cap-meta"><span>'+it.type+'</span><span>'+it.perm+'</span>'+(bound?'<span style="color:#15803D;">本阶段已绑定</span>':'')+'</div></div>'
                + (on ? '<span class="loaded-tag">已启用</span>'
                  : '<button class="btn primary" data-action="cap-quick-on" data-id="'+it.id+'">'+ic('plus')+' 启用</button>')
              + '</div>';
            }).join('')
        + '</div>').join('')
      + '<div style="background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-2);">提示：文件/命令类执行需额外的 AgentApproval，产品建议确认不能替代执行审批。</div>'
    + '</div>';
}

/* ================= 模拟 AI 回复 ================= */
function aiReplyFor(stage, text){
  const t=text||'';
  if(t.includes('上线')||t.includes('发布')) return {t:'ai', text:'发布是受控动作，需要先完成验收清单并发起发布审批。当前需求已具备验收通过记录，可以直接发起。', ev:{run:'AUTO-601', skill:'发布助手'}};
  if(t.includes('测试')) return {t:'ai', text:'测试门禁已执行：单元 4/4、集成 2/2、迁移隔离验证 1/1，未授权写入 0。可以进入验收。', ev:{run:'AUTO-401', skill:'测试执行'}};
  if(t.includes('风险')||t.includes('问题')) return {t:'ai', text:'当前主要风险：迁移尚未应用（需要单独授权）；消息中心 API 为只读联调，写入权限未开放。建议先确认迁移再继续。', ev:{run:'AUTO-300', skill:'风险检查'}};
  if(t.includes('进度')) return {t:'ai', text:'AgentRun #R-102 正在运行：3 个文件变更已完成，正在联调消息中心 API，预计 2 分钟内结束。Zed 终端输出可实时查看。', ev:{run:'R-102', skill:'代码实现'}};
  if(t.includes('方案')) return {t:'ai', text:'当前推荐方案 C（通知服务子任务）：复用消息中心与积分服务，改动最小、可回滚。设计已确认写入 v3。', ev:{run:'AUTO-202', skill:'方案设计'}};
  if(t.includes('感谢')||t.includes('谢谢')) return {t:'ai', text:'不客气。需要继续推进时直接告诉我：下一步是测试门禁 → 验收 → 发布审批。', ev:{run:'AUTO-999', skill:'作业助手'}};
  return {t:'ai', text:'收到，已记录。我基于当前阶段（'+STAGES.find(s=>s.id===stage).label+'）的上下文继续处理：这条输入会作为 WorkTurn 交给本地 Codex（只读理解），任何写入都会先以建议卡片给你确认。', ev:{run:'T-'+Math.floor(100+Math.random()*800), skill:'作业助手'}};
}

/* ================= 定时任务 ================= */
function startTimers(){
  clearInterval(state.progressTick);
  clearInterval(state.terminalTick);
  const p = cv().dev.find(m=>m.t==='progress');
  const t = cv().dev.find(m=>m.t==='terminal');
  if(!p || p.status!=='running') return;
  state.progressTick=setInterval(()=>{
    const now=cv().dev.find(m=>m.t==='progress');
    if(!now||now.status!=='running'){clearInterval(state.progressTick);return;}
    now.pct=Math.min(100, now.pct+7);
    const steps=['done','active','todo','todo','todo'];
    if(now.pct>=35){steps[1]='done';steps[2]='active';}
    if(now.pct>=50) steps[2]='done';
    if(now.pct>=60){steps[3]='active';}
    if(now.pct>=85){steps[3]='done';steps[4]='active';}
    if(now.pct>=100){
      now.status='done'; steps[4]='done';
      if(now.steps[4]) now.steps[4].st='done';
      now.steps.forEach(s=>s.st='done');
    } else {
      now.steps.forEach((s,i)=>s.st=steps[i]);
    }
    const fill=document.getElementById('fill-'+now.id);
    const pctEl=document.getElementById('pct-'+now.id);
    if(fill) fill.style.width=now.pct+'%';
    if(pctEl) pctEl.textContent=now.pct+'%';
    const stream=document.getElementById('stream');
    if(stream){
      const card=stream.querySelector('[data-progress-id="'+now.id+'"]');
      if(card){
        const stepsEl=card.querySelector('.step-list');
        if(stepsEl) stepsEl.innerHTML=now.steps.map(s=>'<div class="step-item '+(s.st==='done'?'done':s.st==='active'?'active':'')+'">'
          +'<span class="step-dot">'+(s.st==='done'?ICONS.check:(s.st==='active'?ICONS.clock:''))+'</span><span>'+esc(s.label)+'</span></div>').join('');
        const head=card.querySelector('.card-head');
        if(now.status==='done'){
          const badge=card.querySelector('.badge-cyan');
          if(badge){badge.className='badge badge-green';badge.textContent='已完成';}
          const btns=card.querySelector('.btn-group');
          if(btns) btns.remove();
        }
      }
    }
    if(now.pct>=100){
      clearInterval(state.progressTick);
      clearInterval(state.terminalTick);
      const terminal=cv().dev.find(m=>m.t==='terminal');
      if(terminal){ const card=document.getElementById('term-'+terminal.id)?.closest('.card'); if(card) card.outerHTML=renderMsg(terminal); }
      refreshSidePanel();
      toast(now.title+' 已完成（演示）');
    }
  },900);
  if(t){
    let li=t.emitted||0;
    state.terminalTick=setInterval(()=>{
      const now2=cv().dev.find(m=>m.t==='terminal');
      if(!now2||activeRun()?.status!=='running'){clearInterval(state.terminalTick);return;}
      const seq=[
        {cls:'info', text:'codex> 联调 notify-client · 消息中心 API 200 OK'},
        {cls:'cmd', text:'codex> 更新 migration 注释: 增加回滚说明'},
        {cls:'ok', text:'codex> 集成测试 2 passed'},
        {cls:'cmd', text:'codex> 汇总变更清单与证据…'},
        {cls:'warn', text:'codex> 等待审批: migration 应用（需要单独授权）'},
      ];
      if(li>=seq.length){clearInterval(state.terminalTick);return;}
      const line=seq[li];
      now2.lines.push(line); li++; now2.emitted=li;
      const box=document.getElementById('term-'+now2.id);
      if(box){
        const d=document.createElement('div');
        d.className='term-line';
        d.innerHTML='<span class="'+line.cls+'">'+esc(line.text)+'</span>';
        box.insertBefore(d, box.querySelector('.term-cursor'));
        box.scrollTop=box.scrollHeight;
      }
      refreshSidePanel();
      if(li>=seq.length) clearInterval(state.terminalTick);
    },1600);
  }
}

/* ================= 事件 ================= */
document.addEventListener('input', function(e){
  if(e.target.id==='chat-input') state.draftInputs[state.activeReq]=e.target.value;
});
document.addEventListener('click', function(e){
  const nav=e.target.closest('[data-nav]');
  if(nav){ state.route=nav.dataset.nav==='home'?'home':(nav.dataset.nav==='delivery'?'work':nav.dataset.nav); render(); return; }
  const stage=e.target.closest('[data-stage]');
  if(stage && !stage.dataset.action){ state.stage=stage.dataset.stage; state.selectedDraft=null; state.focusComposer=false; render(); afterStreamRender(); return; }
  const actEl=e.target.closest('[data-action]');
  if(actEl) handleAction(actEl.dataset.action, actEl);
});
document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && e.target && e.target.id==='chat-input' && !e.isComposing && e.keyCode!==229){
    e.preventDefault(); submitChat();
  }
  if((e.key==='Enter'||e.key===' ') && e.target.matches('[role="button"][data-action]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'){ state.capOpen=false;state.addCapOpen=false;document.getElementById('modal-root').innerHTML='';document.querySelector('[data-action="open-req-switch"]')?.focus(); }
});
window.addEventListener('hashchange', function(){
  parseHash(); render();
});
function handleAction(action, el){
  switch(action){
    case 'back-home': state.route='home'; location.hash=''; render(); break;
    case 'continue-work': state.route='work'; location.hash='#/work'; render(); afterStreamRender(); break;
    case 'todo-open': {
      state.activeReq = el.dataset.req || 'R-1042';
      state.selectedDraft=null;
      state.stage = el.dataset.stage || state.stageByReq[state.activeReq] || 'dev';
      state.route='work'; state.capOpen=false;
      location.hash='#/work';
      render(); afterStreamRender();
      const meta=reqMeta(state.activeReq);
      toast('已进入 '+(meta?meta.id+' · '+meta.name:'需求工作空间'));
      break;
    }
    case 'open-req-switch': {
      const root=document.getElementById('modal-root');
      root.innerHTML='<div class="modal-mask" data-action="close-req-switch"></div>'
        + '<div class="cap-panel req-switch-panel"><div class="cap-head"><h3>切换需求</h3><button class="icon-btn" data-action="close-req-switch">'+ic('x')+'</button></div>'
        + REQS.map(r=>'<div class="req-opt'+(r.id===state.activeReq?' active':'')+'" data-action="req-switch" data-req="'+r.id+'">'
            + '<span class="cap-ico" style="background:var(--brand);color:#fff;">'+ICONS.box+'</span>'
            + '<span class="nm">'+esc(r.id)+' · '+esc(r.name)+'</span>'
            + '<span class="st">'+esc(r.status)+'</span>'
            + (r.id===state.activeReq?'<span class="badge badge-blue">当前</span>':'')
          + '</div>').join('')
        + '<div style="font-size:12px;color:var(--text-3);margin-top:4px;">切换后进入该需求当前阶段；每个需求的对话与产物独立保存。</div>'
        + '</div>';
      break;
    }
    case 'close-req-switch': state.capOpen=false; document.getElementById('modal-root').innerHTML=''; break;
    case 'req-switch': {
      const rid=el.dataset.req;
      state.activeReq=rid;
      state.selectedDraft=null;
      state.stage=state.stageByReq[rid]||'idea';
      state.capOpen=false;
      document.getElementById('modal-root').innerHTML='';
      render(); afterStreamRender();
      const meta=reqMeta(rid);
      toast('已切换到 '+(meta?meta.id+' · '+meta.name:'需求'));
      break;
    }
    case 'notif': toast('暂无新通知（原型演示）'); break;
    case 'panel': state.panel=el.dataset.panel; render(); break;
    case 'open-cap': state.capOpen=true; renderCapPanel(); break;
    case 'close-cap': state.capOpen=false; document.getElementById('modal-root').innerHTML=''; break;
    case 'go-config': state.route='gov'; state.capOpen=false; location.hash='#/gov'; render(); break;
    case 'cap-quick-on': {
      const id=el.dataset.id;
      if(!state.capsOn.includes(id)) state.capsOn.push(id);
      const c=CAPABILITIES.find(x=>x.id===id);
      toast('已启用：'+c.name+'（对话临时启用，可到配置中心长期绑定）');
      renderCapPanel();
      break;
    }
    case 'config-tab': state.configTab=el.dataset.tab; render(); break;
    case 'toggle-cap': {
      const id=el.dataset.id;
      const i=state.capsOn.indexOf(id);
      if(i>=0){ state.capsOn.splice(i,1); toast('已停用：'+CAPABILITIES.find(x=>x.id===id).name); }
      else { state.capsOn.push(id); toast('已启用：'+CAPABILITIES.find(x=>x.id===id).name); }
      render(); break;
    }
    case 'toggle-bind': {
      const sid=el.dataset.stage, id=el.dataset.id;
      const list=state.stageBind[sid];
      const i=list.indexOf(id);
      const c=CAPABILITIES.find(x=>x.id===id);
      if(i>=0){ list.splice(i,1); toast('已从「'+sidLabel(sid)+'」移除：'+c.name); }
      else { if(!state.capsOn.includes(id)) state.capsOn.push(id); list.push(id); toast('已绑定「'+sidLabel(sid)+'」：'+c.name); }
      render(); break;
    }
    case 'cap-detail': {
      const c=CAPABILITIES.find(x=>x.id===el.dataset.id);
      toast(c.name+' · '+c.type+' · '+c.src+' '+c.ver+' · 权限 '+c.perm);
      break;
    }
    case 'open-addcap': state.addCapOpen=true; renderAddCapForm(); break;
    case 'close-addcap': state.addCapOpen=false; document.getElementById('modal-root').innerHTML=''; break;
    case 'confirm-addcap': {
      const name=(document.getElementById('ac-name')||{}).value||'';
      const type=(document.getElementById('ac-type')||{}).value||'Skill';
      const src=(document.getElementById('ac-src')||{}).value||'手动注册';
      const ver=(document.getElementById('ac-ver')||{}).value||'v0.1';
      const perm=(document.getElementById('ac-perm')||{}).value||'只读 + 建议';
      const desc=(document.getElementById('ac-desc')||{}).value||'（待补充描述）';
      if(!name.trim()){ toast('请填写能力名称'); return; }
      const icoMap={Skill:'sparkles', MCP:'folder', 终端工具:'settings'};
      const colMap={Skill:'#A855F7', MCP:'#0078C8', 终端工具:'#0F172A'};
      CAPABILITIES.push({id:'custom-'+Date.now(), name:name.trim(), type:type, src:src, ver:ver, perm:perm, ico:icoMap[type], color:colMap[type], desc:desc.trim()});
      if(!state.capsOn.includes(CAPABILITIES[CAPABILITIES.length-1].id)) state.capsOn.push(CAPABILITIES[CAPABILITIES.length-1].id);
      state.addCapOpen=false;
      document.getElementById('modal-root').innerHTML='';
      state.configTab='catalog';
      render();
      toast('已注册新能力：'+name.trim());
      break;
    }
    case 'answer-clarify': {
      const id=el.dataset.id;
      const c=cv().idea.find(m=>m.t==='clarify'&&m.q.some(q=>q.id===id));
      const q=c?c.q.find(x=>x.id===id):null;
      if(q&&!q.picked){
        q.picked=true;
        const answers=c.q.filter(x=>x.picked).map(x=>x.answer);
        if(c.q.every(x=>x.picked)){
          const idx=cv().idea.indexOf(c);
          cv().idea.splice(idx+1,0,{t:'user', text:answers.join('；')});
        }
      }
      render(); afterStreamRender(); break;
    }
    case 'open-diff': state.selectedDraft=el.dataset.id; state.panel='canvas'; render(); break;
    case 'confirm-draft': {
      const id=el.dataset.id;
      let found=null;
      Object.keys(cv()).forEach(k=>{
        cv()[k].forEach(m=>{ if(m.t==='draft'&&m.id===id) found=m; });
      });
      if(found&&!found.confirmed){
        found.confirmed=true;
        found.appliedVersion=found.version;
        toast('已确认 '+found.appliedVersion+'（原型演示，仅当前页面）');
      }
      render(); afterStreamRender(); break;
    }
    case 'reject-draft': toast('已退回重写：Agent 将基于你的反馈重新生成草稿'); break;
    case 'gate-pass': {
      const gid=(el.dataset.id||'').trim();
      let g=null, gstage=null;
      Object.keys(cv()).forEach(k=>{ cv()[k].forEach(m=>{ if(m.t==='gate'&&(!gid||m.id===gid)&&!g){ g=m; gstage=k; } }); });
      if(g&&g.status!=='PASSED'){
        g.status='PASSED';
        toast('门禁已确认 PASS，写入 GateRun 记录');
        if(gstage===state.stage){
          const si=STAGES.findIndex(s=>s.id===gstage);
          if(si<STAGES.length-1){
            state.stage=STAGES[si+1].id;
            state.stageByReq[state.activeReq]=state.stage;
            cv()[state.stage].unshift({t:'ai', text:'门禁通过，已进入「'+STAGES[si+1].label+'」阶段。以下是该阶段的作业上下文，Agent 将继续推进。', ev:{run:'AUTO-GATE', skill:'阶段推进'}});
            toast('已推进到「'+STAGES[si+1].label+'」阶段');
          }
        }
      }
      render(); afterStreamRender(); break;
    }
    case 'gate-block': {
      const gid=(el.dataset.id||'').trim();
      let g=null;
      Object.keys(cv()).forEach(k=>{ cv()[k].forEach(m=>{ if(m.t==='gate'&&(!gid||m.id===gid)&&!g) g=m; }); });
      if(g) g.status='BLOCKED';
      toast('已标记 BLOCK：显示阻断原因与恢复动作');
      render(); afterStreamRender(); break;
    }
    case 'approve': {
      const a=cv().release.find(m=>m.t==='approval');
      if(a&&a.status==='pending'){
        a.status='approved';
        toast('发布审批已批准，进入观察窗口');
        state.stage='observe';
        render(); afterStreamRender();
      } else { toast('该审批已完成'); }
      break;
    }
    case 'reject': { const a=cv().release.find(m=>m.t==='approval'); if(a) a.status='rejected'; render(); afterStreamRender(); toast('已拒绝：原因将记录，不会执行发布'); break; }
    case 'shrink': { const a=cv().release.find(m=>m.t==='approval'); if(a) a.status='pending'; toast('已缩小范围：仅迁移预演，不含真实发布'); break; }
    case 'stop-run': {
      const p=cv().dev.find(m=>m.t==='progress');
      if(p&&p.status==='running'){ p.status='stopped'; }
      clearInterval(state.progressTick);
      clearInterval(state.terminalTick);
      render();
      toast('已停止 '+(p?.title||'AgentRun')+'，保留当前进度与执行记录（演示）');
      break;
    }
    case 'send': submitChat(); break;
    case 'open-url': break;
  }
}
function submitChat(){
  const inp=document.getElementById('chat-input');
  const text=inp?inp.value.trim():'';
  if(!text) return;
  state.draftInputs[state.activeReq]='';
  const rep=aiReplyFor(state.stage, text);
  rep._id='ai-'+(++state.msgSeq);
  rep.fullText=rep.text;
  rep.typing=true;
  rep.text='';
  cv()[state.stage].push({t:'user', text});
  cv()[state.stage].push(rep);
  render(); afterStreamRender(true);
  typeAiMessage(rep);
}
function typeAiMessage(m){
  const pending=Object.values(state.convos).flatMap(c=>Object.values(c).flat()).filter(x=>x.typing&&x!==m);
  pending.forEach(x=>{
    x.text=x.fullText;x.typing=false;
    const node=document.getElementById('ai-text-'+x._id);
    if(node){node.textContent=x.text;node.classList.remove('typing');}
  });
  clearInterval(state.typeTick);
  const full=m.fullText;
  let i=0;
  state.typeTick=setInterval(()=>{
    i=Math.min(full.length, i+2);
    m.text=full.slice(0,i);
    const node=document.getElementById('ai-text-'+m._id);
    if(node){ node.textContent=m.text; }
    const stream=document.getElementById('stream');
    if(stream) stream.scrollTop=stream.scrollHeight;
    if(i>=full.length){
      clearInterval(state.typeTick);
      m.typing=false;
      m.text=full;
      const n2=document.getElementById('ai-text-'+m._id);
      if(n2){ n2.textContent=full; n2.classList.remove('typing'); }
    }
  },26);
}
function afterStreamRender(focus){
  const stream=document.getElementById('stream');
  if(stream){ stream.scrollTop=stream.scrollHeight; }
  if(focus){ const inp=document.getElementById('chat-input'); if(inp) inp.focus(); }
}

/* ================= 路由 ================= */
function parseHash(){
  const h=location.hash;
  if(h.startsWith('#/work')) state.route='work';
  else if(h.startsWith('#/product')||h.startsWith('#/gov')) state.route=h.slice(2);
  else if(h===''||h==='#/'||h==='#') state.route='home';
}
function render(){
  renderHeader();
  const app=document.getElementById('app');
  const sameContext=state.route==='work'&&app.querySelector('.work-layout')?.dataset.context===state.activeReq+':'+state.stage;
  const scrolls=sameContext?['#stream','.ctx-rail','.panel-body','#panel-term'].map(s=>[s,app.querySelector(s)?.scrollTop||0]):[];
  if(state.route==='home') app.innerHTML=renderHome();
  else if(state.route==='work'){ app.innerHTML=renderWork(); startTimers(); }
  else if(state.route==='gov') app.innerHTML=renderGov();
  else app.innerHTML=placeholderPage(state.route);
  scrolls.forEach(([s,top])=>{const el=app.querySelector(s);if(el)el.scrollTop=top;});
  if(!state.capOpen) document.getElementById('modal-root').innerHTML='';
}
function refreshSidePanel(){
  const panel=document.querySelector('.side-panel');
  if(!panel) return;
  const terminal=document.getElementById('panel-term');
  const top=terminal?.scrollTop||0;
  const atEnd=!terminal||terminal.scrollHeight-terminal.clientHeight-top<24;
  const bodyTop=panel.querySelector('.panel-body')?.scrollTop||0;
  panel.outerHTML=renderSidePanel();
  const next=document.getElementById('panel-term');
  if(next) next.scrollTop=atEnd?next.scrollHeight:top;
  const body=document.querySelector('.panel-body');if(body)body.scrollTop=bodyTop;
}
function placeholderPage(route){
  const map={
    product:['产品空间','需求 / CAP-POD / 材料 / 产物版本 / 门禁 / 决策的权威事实视图。','原型演示范围聚焦：需求工作空间、我的工作台与能力配置中心。'],
  };
  const m=map[route]||['页面','',''];
  return '<div class="placeholder-page"><div class="placeholder-card"><h2>'+m[0]+'</h2><p>'+m[1]+'</p><p style="margin-top:8px;">'+m[2]+'</p>'
    + '<ul><li>「我的工作台」：待办、运行中任务、Agent 简报</li><li>「交付中心 · 需求工作空间」：对话主体 + 结构化卡片 + 阶段能力 + 终端实时跟踪</li><li>「治理中心 · 能力配置」：Skill / MCP / 工具的注册、启用与阶段绑定</li></ul>'
    + '<button class="btn primary" data-action="continue-work" style="margin-top:16px;">'+ic('terminal')+' 进入需求工作空间</button></div></div>';
}

/* ================= 配置中心 ================= */
function renderGov(){
  const tabs=[['catalog','能力目录',ICONS.cpu],['bind','阶段绑定',ICONS.layers],['audit','装载与审计',ICONS.list]];
  let body='';
  if(state.configTab==='catalog'){
    const groups=[['Skill',CAPABILITIES.filter(c=>c.type==='Skill')],['MCP 连接',CAPABILITIES.filter(c=>c.type==='MCP')],['终端工具',CAPABILITIES.filter(c=>c.type==='终端工具')]];
    body='<div class="config-card"><h3>'+ic('cpu')+' 能力目录 · Skill / MCP / 终端工具</h3>'
      + '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">在这里注册、启用/停用能力。停用后对话中不可用，已产生的会话事实保留只读。</div>'
      + groups.map(g=>'<div class="rail-title" style="margin:14px 0 8px;">'+g[0]+'（'+g[1].length+'）</div>'
          + g[1].map(c=>capRow(c)).join('')
        ).join('')
      + '<button class="btn primary" data-action="open-addcap" style="margin-top:8px;">'+ic('plus')+' 注册新能力</button>'
      + '</div>';
  } else if(state.configTab==='bind'){
    body='<div class="config-card"><h3>'+ic('layers')+' 阶段绑定 · 每个阶段自动装载哪些能力</h3>'
      + '<div style="font-size:12px;color:var(--text-3);margin-bottom:12px;">勾选后，产品经理进入对应阶段时这些能力自动就绪（仍可在对话中临时增减）。</div>'
      + '<table class="bind-grid"><tr><th style="width:110px;">阶段</th><th>启用的能力</th></tr>'
      + STAGES.map(s=>{
          const bound=state.stageBind[s.id]||[];
          return '<tr class="stage-row"><td class="st-name">'+s.dot+' '+s.label+'</td><td><div class="bind-cell">'
            + CAPABILITIES.map(c=>{
                const on=bound.includes(c.id);
                return '<span class="bind-chip'+(on?' on':'')+'" data-action="toggle-bind" data-stage="'+s.id+'" data-id="'+c.id+'">'
                  + '<span class="ico">'+CAP_ICON[c.ico]+'</span>'+esc(c.name)+'</span>';
              }).join('')
            + '</div></td></tr>';
        }).join('')
      + '</table>'
      + '<div style="margin-top:10px;font-size:12px;color:var(--text-3);">点击能力标签切换绑定；开发阶段建议绑定 Codex / Zed / VS Code 与代码实现 Skill，以启用终端实时跟踪。</div>'
      + '</div>';
  } else {
    body='<div class="config-card"><h3>'+ic('list')+' 装载与审计记录</h3>'
      + '<div style="font-size:12px;color:var(--text-3);margin-bottom:10px;">所有能力装载、启用与传输授权都有记录，可在治理中心追溯。</div>'
      + auditLine('10:02', '装载', 'Codex · 终端工具 · 来源 OpenAI · v0.1（会话 R-102）')
      + auditLine('10:02', '装载', 'Zed · 终端工具 · 来源 Zed 官方 · v0.16（会话 R-102）')
      + auditLine('10:05', '传输授权', 'TRANSMIT_MATERIAL · R-1042 → codex · 有效期 30min · 授权人 陈立')
      + auditLine('10:20', '绑定', '「开发」阶段绑定：代码实现 / Codex / Zed / VS Code / 数据库查询')
      + auditLine('09:15', '启用', 'PRD 生成 v1.1 由 PFC 官方发布，默认可用')
      + '</div>';
  }
  return '<div class="config-wrap">'
    + '<div class="config-head"><div><h2>'+ic('shield')+' 治理中心 · 能力配置</h2>'
      + '<div class="sub">Skill / MCP / 终端工具的注册、启用与阶段绑定；装载记录进入审计。</div></div>'
      + '<button class="btn" data-action="back-home">'+ic('home')+' 返回工作台</button></div>'
    + '<div class="config-tabs">'+tabs.map(t=>'<button class="config-tab'+(state.configTab===t[0]?' active':'')+'" data-action="config-tab" data-tab="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>').join('')+'</div>'
    + body
  + '</div>';
}
function capRow(c){
  const on=state.capsOn.includes(c.id);
  const boundCnt=Object.values(state.stageBind).filter(list=>list.includes(c.id)).length;
  return '<div class="cap-row"><span class="cap-ico" style="background:'+c.color+';">'+CAP_ICON[c.ico]+'</span>'
    + '<div class="cap-main"><div class="cap-name">'+esc(c.name)+' <span class="type-tag type-'+c.type+'">'+c.type+'</span></div>'
    + '<div class="cap-desc">'+esc(c.desc)+'</div>'
    + '<div class="cap-meta"><span>来源 '+esc(c.src)+'</span><span>版本 '+esc(c.ver)+'</span><span>权限 '+esc(c.perm)+'</span><span>绑定 '+boundCnt+' 个阶段</span></div></div>'
    + '<div class="cap-actions">'
    + '<button class="btn ghost" data-action="cap-detail" data-id="'+c.id+'">详情</button>'
    + '<div class="switch'+(on?' on':'')+'" data-action="toggle-cap" data-id="'+c.id+'" title="'+(on?'停用':'启用')+'"></div>'
    + '</div></div>';
}
function auditLine(t, type, text){
  return '<div class="audit-line"><span class="t">'+t+'</span><span style="flex:none;color:var(--brand-strong);font-weight:600;">'+type+'</span><span>'+esc(text)+'</span></div>';
}
function renderAddCapForm(){
  const root=document.getElementById('modal-root');
  root.innerHTML='<div class="modal-mask" data-action="close-addcap"></div>'
    + '<div class="cap-panel"><div class="cap-head"><h3>注册新能力</h3><button class="icon-btn" data-action="close-addcap">'+ic('x')+'</button></div>'
    + '<div class="addcap-form">'
      + '<div><label>能力名称</label><input id="ac-name" placeholder="如：截图理解"></div>'
      + '<div><label>类型</label><select id="ac-type"><option>Skill</option><option>MCP</option><option>终端工具</option></select></div>'
      + '<div><label>来源</label><input id="ac-src" placeholder="如：PFC 官方 / MCP 市场"></div>'
      + '<div><label>版本</label><input id="ac-ver" placeholder="如：v1.0"></div>'
      + '<div class="full"><label>权限等级</label><select id="ac-perm"><option>只读 + 建议</option><option>受控执行</option><option>受控 + 审批</option><option>会话镜像</option></select></div>'
      + '<div class="full"><label>能力描述</label><input id="ac-desc" placeholder="一句话说明它能做什么"></div>'
    + '</div>'
    + '<div class="btn-group"><button class="btn primary" data-action="confirm-addcap">'+ic('check')+' 注册</button><button class="btn ghost" data-action="close-addcap">取消</button></div>'
    + '</div>';
}

/* ================= 启动 ================= */
parseHash();
render();
</script>
</body>
</html>
